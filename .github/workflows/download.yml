name: Download Apple Music

on:
  workflow_dispatch:
    inputs:
      urls:
        description: One Apple Music URL per line
        required: true
        type: string
        default: |
          https://music.apple.com/cn/album/savage-daughter/1680492302?i=1680492303
          https://music.apple.com/cn/album/%E7%A5%9E%E5%A5%87/255920420?i=255920667
          https://music.apple.com/cn/album/nate-growing-up-from-euphoria-season-1-soundtrack/1481092579?i=1481092685
      quality:
        description: Download quality
        required: true
        type: choice
        default: alac
        options:
          - alac
          - atmos
          - aac
      wrapper_mode:
        description: Wrapper connection
        required: true
        type: choice
        default: temporary
        options:
          - temporary
          - existing
      convert_to:
        description: Optional post-download format
        required: true
        type: choice
        default: original
        options:
          - original
          - flac
          - mp3
          - opus
          - wav

permissions:
  contents: read

concurrency:
  group: amdl-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build downloader
        run: go build -trimpath -o "$RUNNER_TEMP/amdl" .

      - name: Build temporary wrapper manager
        if: inputs.wrapper_mode == 'temporary'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch amdl https://github.com/AMDL-Web/wrapper.git "$RUNNER_TEMP/wrapper-src"
          cd "$RUNNER_TEMP/wrapper-src/manager"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/wrapper-manager" .

      - name: Start temporary wrapper and public login gate
        if: inputs.wrapper_mode == 'temporary'
        env:
          API_KEY: ${{ secrets.AMDL_WRAPPER_KEY }}
          AMDL_PROXY: ${{ secrets.AMDL_PROXY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" || ${#API_KEY} -lt 32 ]]; then
            echo "::error title=Missing AMDL_WRAPPER_KEY::Set a random repository secret of at least 32 characters."
            exit 1
          fi

          runtime="$RUNNER_TEMP/amdl-runtime"
          mkdir -p "$runtime"
          cd "$runtime"
          proxy_args=()
          if [[ -n "${AMDL_PROXY:-}" ]]; then
            proxy_args=(-proxy "$AMDL_PROXY")
          fi
          nohup sudo --preserve-env=API_KEY "$RUNNER_TEMP/wrapper-manager" \
            -host 127.0.0.1 -port 8080 -launcher root "${proxy_args[@]}" \
            > wrapper-manager.log 2>&1 &
          echo $! > wrapper-manager.pid

          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:8080 > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          public_url=""
          for _ in $(seq 1 90); do
            public_url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            [[ -n "$public_url" ]] && break
            sleep 1
          done
          if [[ -z "$public_url" ]]; then
            echo "::error::Cloudflare Tunnel did not provide a public URL"
            tail -n 100 cloudflared.log
            exit 1
          fi

          {
            echo "### Apple Music login"
            echo
            echo "Open: $public_url"
            echo
            echo "Enter the wrapper key from your local key file, then sign in with Apple ID and complete 2FA."
            echo "The public URL closes automatically after login is detected."
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$public_url" > "$runtime/login-url.txt"
          echo "Open the job summary for the temporary login URL."
          echo "AMDL_LITE_SERVER=http://127.0.0.1:8080" >> "$GITHUB_ENV"

      - name: Publish temporary login URL
        if: inputs.wrapper_mode == 'temporary'
        uses: actions/upload-artifact@v4
        with:
          name: amdl-login-url
          path: ${{ runner.temp }}/amdl-runtime/login-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Apple Music login
        if: inputs.wrapper_mode == 'temporary'
        env:
          API_KEY: ${{ secrets.AMDL_WRAPPER_KEY }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            if response=$(curl -fsS -H "Authorization: Bearer $API_KEY" http://127.0.0.1:8080/status 2>/dev/null) &&
               jq -e '.code == 0 and ((.data.regions // []) | length > 0)' >/dev/null <<< "$response"; then
              echo "Apple Music account is ready."
              exit 0
            fi
            if (( attempt % 12 == 0 )); then
              echo "Waiting for login... $((attempt / 12)) minute(s)"
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for Apple Music login"
          tail -n 120 "$RUNNER_TEMP/amdl-runtime/wrapper-manager.log" || true
          exit 1

      - name: Close public login gate
        if: always() && inputs.wrapper_mode == 'temporary'
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/amdl-runtime"
          if [[ -f "$runtime/cloudflared.pid" ]]; then
            kill "$(cat "$runtime/cloudflared.pid")" 2>/dev/null || true
          fi
          echo "Public login URL is closed."

      - name: Write runtime config
        env:
          AMDL_LITE_SERVER: ${{ secrets.AMDL_LITE_SERVER }}
          AMDL_MEDIA_USER_TOKEN: ${{ secrets.AMDL_MEDIA_USER_TOKEN }}
          AMDL_AUTHORIZATION_TOKEN: ${{ secrets.AMDL_AUTHORIZATION_TOKEN }}
          AMDL_PROXY: ${{ secrets.AMDL_PROXY }}
          CONVERT_TO: ${{ inputs.convert_to }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.wrapper_mode }}" == "existing" && -z "${AMDL_LITE_SERVER:-}" ]]; then
            echo "::error title=Missing AMDL_LITE_SERVER::Set the AMDL_LITE_SERVER repository secret to a public wrapper-lite URL reachable from GitHub-hosted runners."
            exit 1
          fi
          if [[ "${{ inputs.wrapper_mode }}" == "temporary" ]]; then
            AMDL_LITE_SERVER="http://127.0.0.1:8080"
          fi

          python3 - "$PWD/config.yaml" "$AMDL_LITE_SERVER" <<'PY'
          import json
          import os
          import sys

          def value(name):
              return json.dumps(os.environ.get(name, ""), ensure_ascii=False)

          convert_to = os.environ["CONVERT_TO"]
          converted = "false" if convert_to == "original" else "true"
          config = f"""general:
            lite-server: {json.dumps(sys.argv[2], ensure_ascii=False)}
            media-user-token: {value("AMDL_MEDIA_USER_TOKEN")}
            authorization-token: {value("AMDL_AUTHORIZATION_TOKEN")}
            proxy: {value("AMDL_PROXY")}
            exit-on-error: true

          paths:
            alac: "artifacts/AM-Lossless"
            atmos: "artifacts/AM-Atmos"
            aac: "artifacts/AM-AAC"

          convert:
            after-download: {converted}
            format: {value(convert_to if convert_to != "original" else "flac")}
            keep-original: true
          """
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(config)
          PY

      - name: Download tracks
        env:
          INPUT_URLS: ${{ inputs.urls }}
          QUALITY: ${{ inputs.quality }}
          AMDL_WRAPPER_KEY: ${{ secrets.AMDL_WRAPPER_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          failed=0

          while IFS= read -r url; do
            url="${url//$'\r'/}"
            [[ -z "${url//[[:space:]]/}" ]] && continue
            args=(--config "$PWD/config.yaml" --json)
            case "$QUALITY" in
              alac) ;;
              atmos) args+=(--atmos) ;;
              aac) args+=(--aac) ;;
              *) echo "::error::Unsupported quality: $QUALITY"; exit 1 ;;
            esac
            echo "Downloading: $url"
            "$RUNNER_TEMP/amdl" "${args[@]}" "$url" || failed=1
          done <<< "$INPUT_URLS"

          find artifacts -type f -maxdepth 4 -print0 | xargs -0 -r ls -lh
          exit "$failed"

      - name: Upload downloaded media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Stop temporary wrapper
        if: always() && inputs.wrapper_mode == 'temporary'
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/amdl-runtime"
          if [[ -f "$runtime/wrapper-manager.pid" ]]; then
            sudo kill "$(cat "$runtime/wrapper-manager.pid")" 2>/dev/null || true
          fi
